name: Deploy to GitHub Pages (on Release)

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # IMPORTANTE: para GH Pages (sin dominio) servirá en /<repo>/,
      # así que le pasamos --base=/<repo>/ al build SIN tocar tu vite.config.js
      - name: Build with correct base path
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Si usas React Router / rutas del lado del cliente:
      - name: SPA fallback (404 -> index)
        run: cp dist/index.html dist/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
